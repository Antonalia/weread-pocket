<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">WeRead Pocket — one reader, several positions</title>
  <desc id="desc">A schematic of an Obsidian-style workspace with a WeRead Pocket local bookshelf, a bottom sidebar reader, and a literature card. All text is an illustrative placeholder, not a book excerpt.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#202128"/>
      <stop offset="1" stop-color="#2b2b36"/>
    </linearGradient>
    <linearGradient id="accent" x2="1">
      <stop stop-color="#a596e6"/>
      <stop offset="1" stop-color="#6cc6dc"/>
    </linearGradient>
    <style>
      text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
      .title { fill:#e4e4eb; font-size:28px; font-weight:600; }
      .subtitle { fill:#a5a5b8; font-size:15px; }
      .label { fill:#c5c5d2; font-size:14px; }
      .muted { fill:#9293a8; font-size:13px; }
      .body { fill:#cacbd6; font-size:17px; }
      .small { fill:#a8a0d1; font-size:12px; }
      .edge { stroke:#454653; stroke-width:1; fill:none; }
    </style>
  </defs>
